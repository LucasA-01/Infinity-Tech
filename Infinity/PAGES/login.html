<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>
    <link rel="shortcut icon" href="../ASSETS/ICON/Favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <header id="topo">
        <a href="../index.html"><img src="../ASSETS/IMG/Logo.png" alt="Logo da Infinity Tech" class="logo"></a>
        <nav class="navegacao">
            <ul class="menu">
                <li><a href="login.html"><img src="../ASSETS/ICON/login.png" alt="Login" class="icon">Login</a></li>
                <li><a href=""><img src="../ASSETS/ICON/sobre.png" alt="Sobre nós" class="icon"></a></li>
                <li><a href=""><img src="../ASSETS/ICON/Ajuda.png" alt="Suporte" class="icon"></a></li>
                <li><a href=""><img src="../ASSETS/ICON/Acessibilidade.png" alt="Acessibilidade" class="icon"></a></li>
                <li><a href=""><img src="../ASSETS/ICON/Carrinho.png" alt="Carrinho de compras" class="icon"></a></li>
                <li><a href=""><img src="../ASSETS/ICON/favoritos.png" alt="Itens favoritos" class="icon"></a></li>
            </ul>
        </nav>
    </header>

    <main class="area-login">
        <div class="formulario">

            <h1>Cadastro</h1>
            <p>Preencha seus dados abaixo</p>

            <form method="post" action="../PHP/salvar.php">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>

                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento"
                       name="nascimento" required>

                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco"
                       placeholder="Digite seu endereço" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf"
                       placeholder="000.000.000-00"
                       maxlength="14" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       placeholder="Digite seu e-mail" required>

                <div class="botoes">

                    <button type="submit">
                        Cadastrar
                    </button>

                    <button type="reset" class="limpar">
                        Limpar
                    </button>

                </div>

            </form>

        </div>
    </main>

    <footer>
        <aside class="footer-column">
            <h4>Atendimento</h4>
            <ul>
                <li><a href="">Ajuda e Suporte</a></li>
                <li><a href="">Fale conosco via Whatsapp</a></li>
            </ul>
        </aside>

        <section>
            <h3>Mídias sociais:</h3>
           
                <a href=""><img src="../ASSETS/ICON/Instagram_icon.png" alt="Instagram" class="icon"></a>
               <a href=""><img src="../ASSETS/ICON/twitter-icon.png" alt="Twitter" class="icon"></a>
            
        </section>
    </footer>
</body>

</html>
